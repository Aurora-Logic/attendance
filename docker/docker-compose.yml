name: vyuha

# Local development stack only. Staging and production run the same four
# services but with real credentials injected from the environment, never
# from this file.

# Host ports are offset into a 5xxxx range on purpose. A developer machine very
# often already runs Postgres or Redis natively - this one did, via a Homebrew
# launch agent holding 5432 - and the failure is nasty: the container reports
# healthy, connections succeed, and you are talking to the wrong database.
# Container-internal ports are unchanged, so service-to-service URLs are normal.

services:
  postgres:
    image: postgres:16-alpine
    container_name: vyuha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vyuha
      POSTGRES_PASSWORD: vyuha_dev_only
      POSTGRES_DB: vyuha
    # NFR-05 stores every timestamp in UTC. Pinning the server timezone keeps a
    # developer's local clock out of attendance arithmetic.
    command: ['postgres', '-c', 'timezone=UTC', '-c', 'log_statement=none']
    ports:
      - '55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vyuha -d vyuha']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: vyuha-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '56379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: vyuha-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: vyuha
      MINIO_ROOT_PASSWORD: vyuha_dev_only
    ports:
      - '59000:9000'
      - '59001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the photo and export buckets on first boot so a fresh clone does
  # not fail its first punch upload.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: vyuha-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 vyuha vyuha_dev_only
        mc mb --ignore-existing local/vyuha-photos
        mc mb --ignore-existing local/vyuha-exports
        mc anonymous set none local/vyuha-photos
        mc anonymous set none local/vyuha-exports
        echo "buckets ready"

  # SMTP sink. Mailpit rather than the MailHog named in the technical design:
  # MailHog has had no release since 2020 and ships no arm64 image, so it runs
  # under emulation on Apple Silicon. Same role, same SMTP port, dev only.
  mailpit:
    image: axllent/mailpit:v1.22
    container_name: vyuha-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '51025:1025'
      - '58025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  minio-data:
